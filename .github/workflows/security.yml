name: security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # run the scanner directly: the marketplace action guesses a commit range and breaks on
      # force-pushed or squashed history
      - name: gitleaks (full history)
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
          gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --exit-code 1 --verbose
      - name: no key files
        run: |
          if git ls-files | grep -Ei '(^|/)\.(admin_key|master_mnemonic|master_xprv|dev\.vars)$|^\.staging/|\.testnet_burn$'; then
            echo "::error::a secret file is tracked in git"; exit 1
          fi

  syntax:
    name: syntax and audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: worker and site parse
        run: |
          node --check worker/index.js
          node --check worker/stellar.js
          node --check worker/orders.js
          node --check site/app.js
      - name: order matching rules
        run: node tools/test_order_match.mjs
      - name: no hardcoded keys in source
        run: |
          if grep -rIn --exclude-dir=node_modules -E '\bS[A-Z2-7]{55}\b|xprv[0-9A-Za-z]{50,}|github_pat_[A-Za-z0-9_]{20,}' worker site deploy.sh deploy-staging.sh 2>/dev/null; then
            echo "::error::possible credential in source"; exit 1
          fi
      - name: dependency audit (informational)
        continue-on-error: true
        run: |
          npm audit --audit-level=high || true
          cd stellar && npm audit --audit-level=high || true
